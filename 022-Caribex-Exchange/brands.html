    <link href="css/animate.css" rel="stylesheet">
    <link href="slick/slick-theme.css" rel="stylesheet" type="text/css">

<body>


    <div id="Header"></div>

    <section class="inner-banner">
        <img src="images/banner-left.jpg" alt="banner-left-img" class="banner-left-img">

            <div class="row">
                <div class="col-lg-12 col-xl-12 col-md-12 col-sm-12">

                        <h1>Brands</h1>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- Inner Banner End  -->

                        <div class="brand-box" data-aos="fade-up" data-aos-duration="1000">
                            <div class="brand-image">
                                <img src="images/product1.jpg" alt="Caribex">
                            </div>
                            <h4>Caribex</h4>

                        </div>
                    </div>
                    <div class="col-lg-3 col-md-6 mb-4">
                        <div class="brand-box" data-aos="fade-up" data-aos-duration="1000" data-aos-delay="100">

                            </div>

                    </div>

                            </div>

                            <a href="products.html" class="theme-btn style1">View Products</a>
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-6 mb-4">
                        <div class="brand-box" data-aos="fade-up" data-aos-duration="1000">

                    </div>

                        <div class="brand-box" data-aos="fade-up" data-aos-duration="1000" data-aos-delay="100">
                            <div class="brand-image">
                                <img src="images/product1.jpg" alt="Mountain Gear">
                            </div>

                            <a href="products.html" class="theme-btn style1">View Products</a>
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-6 mb-4">
                        <div class="brand-box" data-aos="fade-up" data-aos-duration="1000" data-aos-delay="200">

                <div class="row brand-grid">
                    <div class="col-lg-3 col-md-6 mb-4">
                        <div class="brand-box" data-aos="fade-up" data-aos-duration="1000">
                            <div class="brand-image">
                                <img src="images/product3.jpg" alt="Genuine Grip">

                            <h4>Genuine Grip</h4>
                            <a href="products.html" class="theme-btn style1">View Products</a>
