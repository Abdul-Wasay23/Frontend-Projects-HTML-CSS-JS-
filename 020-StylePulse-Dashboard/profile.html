<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />

    <title>Profile </title>
    <link rel="icon" type="image/x-icon" href="/images/">
    <link href="css/bootstrap.css" rel="stylesheet" />
    <link rel="preload" href="css/custom.css" as="style" onload="this.rel='stylesheet'" />
    <noscript>
        <link href="css/custom.css" rel="stylesheet" />
    </noscript>
    <link href="css/animate.css" rel="stylesheet" />
    <link href="slick/slick-theme.css" rel="stylesheet" type="text/css" />
    <link href="slick/slick.css" rel="stylesheet" type="text/css" />
    <link href="css/slicknav.css" rel="stylesheet" type="text/css" />
    <link href="css/css-new.css" rel="stylesheet" />
    <link href="css/responsive.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>

<body class="profile">

    <!-- Dashboard Page Start -->
    <div class="dashboard_page-box">
        <div class="container-fluid">
            <div class="row">
                <div class="col-xl-2 col-lg-3 col-md-4 sidebar-col" id="sidebar-box">

                    <!-- Sidebar Menu Start -->
                    <div id="Sidebar"></div>
                    <!-- Sidebar Menu End -->

                </div>
                <div class="col-xl-10 col-lg-9 col-md-8 page-col" id="page-content">
                    <div class="dashbord-right-box">

                        <!-- Top Bar Menu Start -->
                        <div id="TopBar"></div>
                        <!-- Top Bar Menu End -->


                        <div class="dashboar_page-content home-page">
                            <!-- Page Content Start -->
                            <div class="row">
                                <div class="col-lg-12 col-md-12">
                                    <div class="dashboard-main-box profile-main-box">
                                        <div class="profile-top-bar">
                                            <h2>
                                                Profile
                                            </h2>
                                        </div>
                                        <div class="profile-inner-box">
                                            <div class="row">
                                                <div class="col-lg-8">
                                                    <div class="profile-steps">
                                                        <form id="profile-step-form" action="">
                                                            <!-- Step 1 -->
                                                            <div class="step-content" id="step1">
                                                                <div class="row">
                                                                    <div class="col-lg-6 mb-2">
                                                                        <div class="form-group">
                                                                            <label>FIRST NAME</label>
                                                                            <input type="text"
                                                                                class="form-control profile-input"
                                                                                placeholder="ENTER FIRST NAME">
                                                                        </div>
                                                                    </div>
                                                                    <div class="col-lg-6 mb-2">
                                                                        <div class="form-group">
                                                                            <label>LAST NAME</label>
                                                                            <input type="text"
                                                                                class="form-control profile-input"
                                                                                placeholder="ENTER LAST NAME">
                                                                        </div>
                                                                    </div>
                                                                    <div class="col-lg-6 mb-2">
                                                                        <div class="form-group">
                                                                            <label>EMAIL</label>
                                                                            <input type="email"
                                                                                class="form-control profile-input"
                                                                                placeholder="ENTER EMAIL">
                                                                        </div>
                                                                    </div>
                                                                    <div class="col-lg-6 mb-2">
                                                                        <div class="form-group">
                                                                            <label>PHONE NUMBER</label>
                                                                            <input type="number"
                                                                                class="form-control profile-input"
                                                                                placeholder="ENTER PHONE NUMBER">
                                                                        </div>
                                                                    </div>
                                                                    <div class="col-lg-6 mb-2">
                                                                        <div class="form-group">
                                                                            <label>GENDER</label>
                                                                            <select
                                                                                class="form-control profile-input form-select">
                                                                                <option selected disabled>FEMALE
                                                                                </option>
                                                                                <option>MALE</option>
                                                                                <option>OTHER</option>
                                                                            </select>
                                                                        </div>
                                                                    </div>
                                                                    <div class="col-lg-6 mb-2">
                                                                        <div class="form-group position-relative">
                                                                            <label>DATE OF BIRTH</label>
                                                                            <input type="text"
                                                                                class="form-control profile-input"
                                                                                id="dob-datepicker"
                                                                                placeholder="DD/MM/YY">
                                                                            <i
                                                                                class="fa-regular fa-calendar date-icon"></i>
                                                                        </div>
                                                                    </div>
                                                                    <div class="col-lg-4 mb-4">
                                                                        <div class="form-group">
                                                                            <label>STATE</label>
                                                                            <select
                                                                                class="form-control profile-input form-select">
                                                                                <option selected disabled>ALASKA
                                                                                </option>
                                                                                <option>CALIFORNIA</option>
                                                                                <option>TEXAS</option>
                                                                            </select>
                                                                        </div>
                                                                    </div>
                                                                    <div class="col-lg-4 mb-4">
                                                                        <div class="form-group">
                                                                            <label>CITY</label>
                                                                            <select
                                                                                class="form-control profile-input form-select">
                                                                                <option selected disabled>CITY NAME
                                                                                </option>
                                                                                <option>NEW YORK</option>
                                                                                <option>LOS ANGELES</option>
                                                                            </select>
                                                                        </div>
                                                                    </div>
                                                                    <div class="col-lg-4 mb-4">
                                                                        <div class="form-group">
                                                                            <label>ZIP CODE</label>
                                                                            <input type="number"
                                                                                class="form-control profile-input"
                                                                                placeholder="123 456">
                                                                        </div>
                                                                    </div>
                                                                    <div class="col-lg-12">
                                                                        <button type="button"
                                                                            class="theme-btn mt-3">NEXT</button>
                                                                    </div>
                                                                </div>
                                                            </div>

                                                            <!-- Step 2 (Questionnaire) -->
                                                            <div class="step-content" id="step2" style="display: none;">
                                                                <div class="row">
                                                                    <div class="col-lg-12">
                                                                        <h4 class="form-step-title mb-4">STYLE
                                                                            QUESTIONNAIRE</h4>
                                                                    </div>

                                                                    <!-- Considerations -->
                                                                    <div class="col-lg-12 mb-4">
                                                                        <div class="form-group">
                                                                            <label>DO YOU HAVE ANY HEALTH OR COMFORT
                                                                                CONSIDERATIONS?</label>
                                                                            <textarea
                                                                                class="form-control profile-input profile-textarea"
                                                                                placeholder="EG: SKIN SENSITIVITY, ALLERGIES"></textarea>
                                                                        </div>
                                                                    </div>

                                                                    <!-- Preferred Colors -->
                                                                    <div class="col-lg-12 mb-4">
                                                                        <div class="form-group">
                                                                            <label>PREFERRED COLORS</label>
                                                                            <div class="checkbox-group-row">
                                                                                <div class="custom-checkbox">
                                                                                    <input type="checkbox"
                                                                                        id="color-neutral">
                                                                                    <label
                                                                                        for="color-neutral">NEUTRAL</label>
                                                                                </div>
                                                                                <div class="custom-checkbox">
                                                                                    <input type="checkbox"
                                                                                        id="color-bold">
                                                                                    <label for="color-bold">BOLD</label>
                                                                                </div>
                                                                                <div class="custom-checkbox">
                                                                                    <input type="checkbox"
                                                                                        id="color-pastel">
                                                                                    <label
                                                                                        for="color-pastel">PASTEL</label>
                                                                                </div>
                                                                            </div>
                                                                        </div>
                                                                    </div>

                                                                    <!-- Style Preference -->
                                                                    <div class="col-lg-12 mb-4">
                                                                        <div class="form-group">
                                                                            <label>STYLE PREFERENCE</label>
                                                                            <select
                                                                                class="form-control profile-input form-select">
                                                                                <option selected>CASUAL</option>
                                                                                <option>FORMAL</option>
                                                                                <option>SPORTY</option>
                                                                            </select>
                                                                        </div>
                                                                    </div>

                                                                    <!-- Styling Help Frequency -->
                                                                    <div class="col-lg-12 mb-5">
                                                                        <div class="form-group">
                                                                            <label>HOW OFTEN DO YOU NEED STYLING
                                                                                HELP?</label>
                                                                            <div class="checkbox-group-row">
                                                                                <div class="custom-checkbox">
                                                                                    <input type="checkbox"
                                                                                        id="help-weekly">
                                                                                    <label
                                                                                        for="help-weekly">WEEKLY</label>
                                                                                </div>
                                                                                <div class="custom-checkbox">
                                                                                    <input type="checkbox"
                                                                                        id="help-monthly">
                                                                                    <label
                                                                                        for="help-monthly">MONTHLY</label>
                                                                                </div>
                                                                                <div class="custom-checkbox">
                                                                                    <input type="checkbox"
                                                                                        id="help-occasionally">
                                                                                    <label
                                                                                        for="help-occasionally">OCCASIONALLY</label>
                                                                                </div>
                                                                            </div>
                                                                        </div>
                                                                    </div>

                                                                    <div class="col-lg-12 d-flex gap-3">
                                                                        <button type="button"
                                                                            class="theme-btn prev-btn">PREVIOUS</button>
                                                                        <button type="button" class="theme-btn">SAVE
                                                                            PROFILE</button>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </form>
                                                    </div>
                                                </div>
                                                <div class="col-lg-4">
                                                    <div class="change-profile-box">
                                                        <div class="change-profile">
                                                            <input type="file" id="profile-upload"
                                                                style="display: none;" accept="image/*">
                                                            <div class="change-profile-pic">
                                                                <img src="images/user-1.jpg" alt="Profile"
                                                                    class="img-fluid" id="profile-preview">
                                                            </div>
                                                            <div class="change-profile-button">
                                                                <a href="#" class="change-pic-btn">CHANGE
                                                                    PIC</a>
                                                            </div>
                                                        </div>
                                                        <div class="style-profile-section">
                                                            <h4>STYLE PROFILE</h4>
                                                            <div class="style-progress-list">
                                                                <!-- Item 1 -->
                                                                <div class="style-item">
                                                                    <div class="style-label-row">
                                                                        <span class="style-label">CASUAL</span>
                                                                        <span class="style-value">85%</span>
                                                                    </div>
                                                                    <div class="style-progress-track">
                                                                        <div class="style-progress-fill"
                                                                            style="width: 85%;">
                                                                            <div class="style-progress-thumb"></div>
                                                                        </div>
                                                                    </div>
                                                                </div>

                                                                <!-- Item 2 -->
                                                                <div class="style-item">
                                                                    <div class="style-label-row">
                                                                        <span class="style-label">BUSINESS</span>
                                                                        <span class="style-value">70%</span>
                                                                    </div>
                                                                    <div class="style-progress-track">
                                                                        <div class="style-progress-fill"
                                                                            style="width: 70%;">
                                                                            <div class="style-progress-thumb"></div>
                                                                        </div>
                                                                    </div>
                                                                </div>

                                                                <!-- Item 3 -->
                                                                <div class="style-item">
                                                                    <div class="style-label-row">
                                                                        <span class="style-label">SMART CASUAL</span>
                                                                        <span class="style-value">60%</span>
                                                                    </div>
                                                                    <div class="style-progress-track">
                                                                        <div class="style-progress-fill"
                                                                            style="width: 60%;">
                                                                            <div class="style-progress-thumb"></div>
                                                                        </div>
                                                                    </div>
                                                                </div>

                                                                <!-- Item 4 -->
                                                                <div class="style-item">
                                                                    <div class="style-label-row">
                                                                        <span class="style-label">FORMAL</span>
                                                                        <span class="style-value">45%</span>
                                                                    </div>
                                                                    <div class="style-progress-track">
                                                                        <div class="style-progress-fill"
                                                                            style="width: 45%;">
                                                                            <div class="style-progress-thumb"></div>
                                                                        </div>
                                                                    </div>
                                                                </div>

                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <!-- Page Content End -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Dashboard Page End -->

        <script src="js/jquery-3.6.0.min.js"></script>
        <script src="slick/slick.js"></script>
        <script src="slick/slick.min.js"></script>
        <script src="js/jquery.slicknav.js"></script>
        <script src="js/bootstrap.js"></script>
        <script src="js/font.js"></script>
        <script src="js/custom.js"></script>
        <script src="js/topbar.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</body>

</html>
